name: session-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  
  # Core Scientific Stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib

  - mlflow

  - pytest
  - pytest-cov
  - ruff
  - mypy
  
  # Development & Repo Tooling
  - pip
  
  # Python Toolchain Packages (Managed via pip to match your dev flags)
  - pip:
    - -e .[dev]   # Installs your project in editable mode with dev tools (ruff, mypy, pytest)
