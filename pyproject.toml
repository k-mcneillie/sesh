[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sesh"
version = "2.0.0"
description = "Centralised, encapsulated experiment tracking framework for scientific computing."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Konner McNeillie", email = "konner.mcneillie@icloud.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Core runtime is stdlib-only so sesh can be used from any Python project.
# numpy/torch/mlflow unlock extra reproducibility/tracking features below.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24.0"]
torch = ["torch>=2.0.0"]
mlflow = ["mlflow>=2.10.0"]
all = ["sesh[numpy,torch,mlflow]"]
security = [
    "bandit>=1.7.8",
    "pip-audit>=2.7.3",
]
dev-min = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
dev = [
    "sesh[all,dev-min,security]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sesh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=sesh --cov-report=term-missing"

[tool.coverage.run]
source = ["sesh"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # Error
    "F",   # Pyflakes
    "I",   # Isort
    "B",   # Bugbear
    "UP",  # Pyupgrade
    "C90", # Mccabe code complexity
    "C4",  # Flake8-comprehensions
    "N",   # PEP8 Naming conventions
    "SIM", # Flake8-simplify
    "ARG", # Unused arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
